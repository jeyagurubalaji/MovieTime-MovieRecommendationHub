events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip Compression for fast React loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        # --------------------------------------------------
        # 1. React Frontend (Static Files & SPA Routing)
        # --------------------------------------------------
        location / {
            root /usr/share/nginx/html; # Path to built React files (dist)
            index index.html index.htm;
            try_files $uri $uri/ /index.html; # Prevents 404s on page refresh
        }

        # --------------------------------------------------
        # 2. Spring Boot Backend Proxy (/api)
        # --------------------------------------------------
        location /api/ {
            proxy_pass http://localhost:8080/api/; # Your Spring Boot server address
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --------------------------------------------------
        # 3. AI Service Proxy (/ai) - Optional
        # --------------------------------------------------
        location /ai/ {
            proxy_pass http://localhost:8000/; # Your FastAPI/Python AI service address
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --------------------------------------------------
        # 4. Error Pages Configuration
        # --------------------------------------------------
        error_page 500 502 503 504 /5x.html;
        location = /5x.html {
            root /usr/share/nginx/html;
        }
    }
}