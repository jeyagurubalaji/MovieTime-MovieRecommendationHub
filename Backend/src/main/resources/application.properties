spring.application.name=movietime-backend
server.port=${SERVER_PORT:8080}

# ---------- MongoDB ----------
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/movietime}

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-256-bits-for-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------- Google OAuth ----------
google.oauth.client-id=${GOOGLE_CLIENT_ID:my-google-client-id.apps.googleusercontent.com}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:my-google-client-secret}

# ---------- TMDB ----------
tmdb.api-key=${TMDB_API_KEY:my-tmdb-api-key}
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.image-base-url=${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}

# ---------- AI Microservice ----------
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}

# ---------- Mail (Forgot Password) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:my-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:my-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- CORS ----------
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Frontend URL (Password Reset Links) ----------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------- Logging ----------
logging.level.com.movietime=INFO